[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kipp"
version = "0.1.0"
description = "Shaded Kippenhahn diagrams from Cambridge STARS plot files"
requires-python = ">=3.11"
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
kipp = "kipp.cli:main"

[tool.setuptools]
packages = ["kipp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
